[env:esp32dev]
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
board = esp32dev
build_unflags = ${common.build_unflags}
build_flags = ${esp32.build_flags}
    -DSETTINGS_STACK_BUF_SIZE=4096
    -DCONFIG_ASYNC_TCP_STACK_SIZE=10240
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DCONFIG_ASYNC_TCP_TASK_STACK_SIZE=9472
    -DLOROL_LITTLEFS
    -DARDUINO_ARCH_ESP32
    -DWLED_USE_MY_CONFIG
    -DWLED_DEBUG
    -DSR_DEBUG
    -DUSERMOD_AUDIOREACTIVE
    -DUM_AUDIOREACTIVE_ENABLE
    -DSR_DMTYPE=1
    -DI2S_SDPIN=15
    -DI2S_WSPIN=2
    -DI2S_CKPIN=4
    -O2
    -DWLEDMM_FASTPATH
    -DWLEDMM_SAVE_FLASH
    -DWLED_DISABLE_ALEXA
    -DWLED_DISABLE_MQTT
    -DWLED_DISABLE_HUESYNC
    -DWLED_DISABLE_INFRARED
board_build.partitions = ${esp32.default_partitions}
upload_speed = 2000000
lib_deps = 
    ${esp32.lib_deps}
    arduinoFFT @ 2.0.4
monitor_filters = esp32_exception_decoder 

